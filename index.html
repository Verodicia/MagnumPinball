<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <title>Magnum Pinball</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div id="hud-score">0</div>
        <div id="hud-ball">BALL 1</div>
        <div id="hud-mode">BASE MODE</div>
      </header>
      <main id="viewport">
        <div id="callout-banner" aria-live="polite"></div>
      </main>
      <aside id="dashboard">
        <div id="toolbar">
          <button id="btn-menu" title="Main Menu">⌂ Menu</button>
          <button id="btn-play" class="on">▶ Play</button>
          <button id="btn-edit">✎ Creator</button>
          <button id="btn-mute" title="Mute">🔊</button>
        </div>
        <section class="panel backglass-card">
          <div class="translite-banner">
            <div class="translite-title">MAGNUM PINBALL</div>
            <div class="translite-sub">HIGH VELOCITY 240Hz PINBALL</div>
          </div>
          <div class="dmd-bezel">
            <div id="dmd-score">0</div>
            <div id="dmd-mode">BASE MODE</div>
            <div id="dmd-ball-row">
              <span id="dmd-ball-badge">BALL 1/3</span>
              <span id="dmd-status-tag">READY</span>
            </div>
          </div>
        </section>
        <section class="panel" id="rules-panel">
          <h3>Mission / Rules</h3>
          <pre id="rules-status"></pre>
        </section>
        <section class="panel" id="telemetry-panel">
          <h3>Telemetry</h3>
          <pre id="telemetry"></pre>
          <div class="hint">Z / Slash flippers · Space plunger · A D W nudge · R new game</div>
        </section>
        <section class="panel" id="editor-panel" hidden></section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
